{% extends "base.html" %}
{% block title %}Produtos{% endblock %}
{% block content %}
<h1>Produtos</h1>

<table>
  <thead><tr><th>Nome</th><th>Cadastrado em</th></tr></thead>
  <tbody>
    {% for p in produtos %}
    <tr><td>{{ p.nome }}</td><td>{{ p.criado_em.strftime('%d/%m/%Y') }}</td></tr>
    {% else %}
    <tr><td colspan="2">Nenhum produto cadastrado.</td></tr>
    {% endfor %}
  </tbody>
</table>

<div class="card" style="max-width:360px;">
  <h2 style="font-size:1.1rem; margin-top:0;">Cadastrar produto</h2>
  <form method="post" action="/produtos" style="display:flex; gap:.5rem;">
    <input type="text" name="nome" placeholder="Nome do produto" required style="flex:1;">
    <button type="submit">Adicionar</button>
  </form>
</div>
{% endblock %}
