{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:280px; margin:3rem auto 1.5rem;">
  <img src="/static/logo-full.png" alt="Engenharia de Clientes" style="width:100%; border-radius:12px;">
</div>
<div class="card" style="max-width:360px; margin:0 auto;">
  <h1>Entrar</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post" action="/login" style="display:flex; flex-direction:column; gap:.75rem;">
    <input type="text" name="usuario" placeholder="Usuário" required autofocus>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
